name: Refresh Costco Snapshot

# "接 4" — move the ~18-30s live crawl off the request path. This scheduled job
# keeps backend/costco_data.py fresh; the API is always served its offline copy.
#
on:
  schedule:
    - cron: '0 4 * * *'   # daily ~04:00 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The new snapshot must be committed, so this job gets contents:write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Git identity for the automated commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh snapshot (crawl + regenerate + push if changed)
        run: python3 scripts/refresh_snapshot.py

      - name: Scan + deliver alerts (#2 — reuses the price_verdict SSOT)
        # Reads the persisted history, fires an alert per SKU that crosses an
        # alarm verdict AND isn't already in the dedup state. GitHub sink needs
        # only the Actions GITHUB_TOKEN (no new secret); a --limit keeps the first
        # day's digest tasteful. Set TELEGRAM_BOT_TOKEN+TELEGRAM_CHAT_ID and
        # --sink telegram to push to a chat instead (no-ops without creds).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/notify_alerts.py --sink github --limit 10
