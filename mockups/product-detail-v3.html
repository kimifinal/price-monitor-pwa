<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>商品詳情 — 特價紀錄 v3（單一卡，賣場/線上 行內嵌）</title>
  <style>
    /* ============================================================
     * Warm mobile token scope (from .mobile-app in style.css, v3)
     * ============================================================ */
    :root {
      --m-bg:        #f4efe9;
      --m-card:      #ffffff;
      --m-soft:      #fbf5ec;
      --m-nav-bg:    #ffffff;
      --m-ink:       #2b2622;
      --m-ink-2:     #5f5850;
      --m-muted:     #8a8378;
      --m-hairline:  #ece5db;
      --m-brand:     #c8102e;
      --m-brand-ink: #ffffff;
      --m-price:     #e5342a;
      --m-good:      #2e8b57;
      --m-warm:      #f6b24a;
      --m-chip-bg:   #ffffff;
      --m-chip-ink:  #5f5850;
      --m-save-bg:   #fdeaea;
      --m-save-ink:  #c8102e;
      --m-zhe-bg:    #eaf1ff;
      --m-zhe-ink:   #2f5bd0;
      --m-date-bg:   #fff4d6;
      --m-date-ink:  #9a7b1f;
      --m-online-bg: #fff3e0;
      --m-online-ink:#e65100;
      --m-shadow:    rgba(43, 38, 34, 0.05);
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-6: 24px;
      --sp-8: 32px;
      --radius:     10px;
      --radius-lg:  16px;
      --radius-xl:  24px;
      --radius-pill: 999px;
      --font-sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      --font-mono:  "SF Mono", "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--m-bg);
      color: var(--m-ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }

    .detail-page {
      max-width: 420px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--m-bg);
      overflow-x: hidden;
    }

    /* --- Top bar --- */
    .detail-appbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2);
      padding: var(--sp-3) var(--sp-4);
      padding-top: max(var(--sp-3), env(safe-area-inset-top, 0px));
      background: var(--m-card);
      border-bottom: 1px solid var(--m-hairline);
    }
    .detail-back {
      display: inline-flex; align-items: center; gap: 4px;
      border: none; background: none; color: var(--m-brand);
      font-family: var(--font-sans); font-size: 0.9rem; font-weight: 500;
      cursor: pointer; padding: var(--sp-1); border-radius: var(--radius);
    }
    .detail-back:hover { background: var(--m-soft); }
    .detail-title {
      position: absolute; left: 0; right: 0;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 0.95rem; font-weight: 600; color: var(--m-ink);
      pointer-events: none;
    }
    .detail-title-ico { width: 20px; height: 20px; color: var(--m-warm); }
    .detail-actions { display: inline-flex; align-items: center; gap: var(--sp-1); }
    .detail-action-btn {
      width: 44px; height: 44px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--m-hairline); border-radius: var(--radius-pill);
      background: var(--m-card); color: var(--m-ink-2); cursor: pointer; padding: 0;
      transition: background 0.15s, border-color 0.15s;
    }
    .detail-action-btn:hover { background: var(--m-soft); }
    .detail-action-btn.is-active { color: var(--m-price); border-color: var(--m-price); }

    /* --- Scrollable content --- */
    .detail-body {
      flex: 1; overflow-y: auto;
      padding: var(--sp-4) var(--sp-6) var(--sp-8);
      padding-bottom: calc(var(--sp-8) + 80px);
    }

    /* --- Product image --- */
    .detail-img-card {
      background: var(--m-card); border: 1px solid var(--m-hairline);
      border-radius: var(--radius-xl); padding: var(--sp-6);
      display: flex; align-items: center; justify-content: center;
      min-height: 180px; margin-bottom: var(--sp-4);
      box-shadow: 0 2px 8px var(--m-shadow);
    }
    .detail-img-placeholder {
      width: 140px; height: 160px;
      display: flex; align-items: center; justify-content: center; color: var(--m-muted);
    }
    .detail-img-placeholder svg { width: 72px; height: 72px; opacity: 0.3; }

    /* --- Product name + SKU --- */
    .detail-name {
      font-size: 1.15rem; font-weight: 700; color: var(--m-ink);
      line-height: 1.4; margin: 0 0 var(--sp-1); text-wrap: balance;
    }
    .detail-sku {
      font-size: 0.8rem; color: var(--m-muted);
      font-family: var(--font-mono); font-variant-numeric: tabular-nums; margin: 0 0 var(--sp-4);
    }

    /* --- Card --- */
    .detail-card {
      background: var(--m-card); border: 1px solid var(--m-hairline);
      border-radius: var(--radius-lg); padding: var(--sp-4);
      margin-bottom: var(--sp-3); box-shadow: 0 1px 3px var(--m-shadow);
    }
    .card-head {
      display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-3);
    }
    .card-head-ico {
      width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
      color: var(--m-warm);
    }
    .card-title { font-size: 0.95rem; font-weight: 700; color: var(--m-ink); }
    .card-sub { font-size: 0.72rem; color: var(--m-muted); margin-left: 6px; }

    /* ===== 特價紀錄： single card, 賣場/線上 rows inline ===== */
    .ph-channel {
      display: flex; gap: var(--sp-3);
      padding: var(--sp-3) 0;
    }
    .ph-channel + .ph-channel { border-top: 1px dashed var(--m-hairline); }

    .ph-ico {
      width: 40px; height: 40px; flex: 0 0 auto;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--radius);
    }
    .ph-ico--store { background: var(--m-save-bg); color: var(--m-save-ink); }
    .ph-ico--online { background: var(--m-online-bg); color: var(--m-online-ink); }
    .ph-ico svg { width: 20px; height: 20px; }

    .ph-mid { flex: 1; min-width: 0; padding-right: 18px; }

    /* row header: channel name + 特價 N 次 */
    .ph-rowhead {
      display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-2);
    }
    .ph-chan-name { font-size: 0.85rem; font-weight: 700; color: var(--m-ink); }
    .ph-count {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.7rem; font-weight: 600; color: var(--m-ink-2);
      background: var(--m-soft); border: 1px solid var(--m-hairline);
      border-radius: var(--radius-pill); padding: 2px 8px;
    }

    /* --- sparkline (mobile-coloured) --- */
    .ph-spark { width: 100%; height: 40px; display: block; }
    .ph-spark .line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .ph-spark .line--store { stroke: var(--m-warm); }
    .ph-spark .line--online { stroke: var(--m-online-ink); }

    /* --- row foot: stacked (price line / 一年最低 line) so nothing hits the right edge --- */
    .ph-foot {
      display: flex; flex-direction: column; gap: 2px;
      margin-top: var(--sp-2);
    }
    .ph-price-line { display: flex; align-items: baseline; gap: 6px; }
    .ph-now {
      font-family: var(--font-mono); font-variant-numeric: tabular-nums;
      font-size: 1.15rem; font-weight: 700; color: var(--m-price); line-height: 1;
    }
    .ph-save {
      font-size: 0.7rem; color: var(--m-muted); font-variant-numeric: tabular-nums;
      font-weight: 400;
    }
    .ph-low {
      font-size: 0.72rem; color: var(--m-muted);
      font-variant-numeric: tabular-nums;
    }
    .ph-low strong { color: var(--m-good); font-weight: 700; }
    .ph-note { font-size: 0.7rem; color: var(--m-muted); margin: 6px 0 0; line-height: 1.4; }
    .ph-note.is-wait { color: var(--m-muted); font-style: italic; }

    /* --- Bottom CTA --- */
    .detail-cta {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      display: flex; gap: var(--sp-2);
      padding: var(--sp-3) var(--sp-4);
      padding-bottom: max(var(--sp-3), env(safe-area-inset-bottom, 0px));
      background: var(--m-card); border-top: 1px solid var(--m-hairline);
      max-width: 420px; margin: 0 auto;
    }
    .detail-cta-btn {
      flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 48px; padding: 0 var(--sp-4); border-radius: var(--radius-lg);
      font-family: var(--font-sans); font-size: 0.9rem; font-weight: 600;
      cursor: pointer; border: none; transition: transform 0.1s;
    }
    .detail-cta-btn:active { transform: scale(0.97); }
    .detail-cta-btn--primary { background: var(--m-brand); color: var(--m-brand-ink); flex: 1.5; }
    .detail-cta-btn--primary:hover { filter: brightness(1.08); }
    .detail-cta-btn--secondary {
      background: var(--m-card); color: var(--m-ink-2); border: 1px solid var(--m-hairline);
    }
    .detail-cta-btn--secondary:hover { background: var(--m-soft); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body>
  <div class="detail-page">
    <!-- Top bar -->
    <header class="detail-appbar">
      <button class="detail-back" type="button" aria-label="返回">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6" /></svg>
        完成
      </button>
      <div class="detail-title">
        <svg class="detail-title-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3" /><circle cx="12" cy="12" r="5" />
        </svg>
        商品詳情
      </div>
      <div class="detail-actions">
        <button class="detail-action-btn" type="button" aria-label="分享">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 15V3M8 7l4-4 4 4" /><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7" />
          </svg>
        </button>
        <button class="detail-action-btn is-active" type="button" aria-label="加入追蹤">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20s-7-4.55-7-9.8A4.2 4.2 0 0 1 12 7a4.2 4.2 0 0 1 7 3.2C19 15.45 12 20 12 20Z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Scrollable content -->
    <main class="detail-body">
      <!-- Product image -->
      <div class="detail-img-card">
        <div class="detail-img-placeholder" aria-label="商品圖片待補">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="8.5" cy="8.5" r="1.5" /><path d="M21 15l-5-5L5 21" />
          </svg>
        </div>
      </div>

      <!-- Product name + SKU -->
      <h1 class="detail-name">伊萊克斯 無線吸塵器 WQ71-2BSWF</h1>
      <p class="detail-sku">商品編號 153289</p>

      <!-- ===== 特價紀錄（單一卡，賣場/線上 行內嵌，取代規格摘要） ===== -->
      <div class="detail-card" id="section-promo">
        <div class="card-head">
          <span class="card-head-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 17l5-5 4 4 8-8" /><path d="M16 8h5v5" />
            </svg>
          </span>
          <span class="card-title">特價紀錄</span>
          <span class="card-sub">過去一年</span>
        </div>

        <!-- 賣場 row -->
        <div class="ph-channel">
          <span class="ph-ico ph-ico--store">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l1.5-5h15L21 9M3 9h18M3 9v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9M8 21v-6h8v6" />
            </svg>
          </span>
          <div class="ph-mid">
            <div class="ph-rowhead">
              <span class="ph-chan-name">賣場</span>
              <span class="ph-count">特價 2 次</span>
            </div>
            <svg class="ph-spark" viewBox="0 0 120 40" preserveAspectRatio="none" aria-label="賣場價格時間曲線：一年最低 5199" role="img">
              <path class="line line--store" d="M2 10 L22 12 L42 18 L52 26 L62 20 L78 28 L92 32 L104 28 L110 32" />
            </svg>
            <div class="ph-foot">
              <div class="ph-price-line">
                <span class="ph-now">$5,199</span><span class="ph-save">省 $1,700 · 到 11/22</span>
              </div>
              <span class="ph-low">一年最低 <strong>$5,199</strong></span>
            </div>
          </div>
        </div>

        <!-- 線上 row -->
        <div class="ph-channel">
          <span class="ph-ico ph-ico--online">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" /><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20" />
            </svg>
          </span>
          <div class="ph-mid">
            <div class="ph-rowhead">
              <span class="ph-chan-name">線上</span>
              <span class="ph-count">特價 1 次</span>
            </div>
            <svg class="ph-spark" viewBox="0 0 120 40" preserveAspectRatio="none" aria-label="線上價格時間曲線：一年最低 5299" role="img">
              <path class="line line--online" d="M2 12 L30 14 L58 16 L86 20 L110 22" />
            </svg>
            <div class="ph-foot">
              <div class="ph-price-line">
                <span class="ph-now">$5,299</span><span class="ph-save">省 $1,700 · 到 11/22</span>
              </div>
              <span class="ph-low">一年最低 <strong>$5,299</strong></span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom CTA bar -->
    <div class="detail-cta">
      <button class="detail-cta-btn detail-cta-btn--primary" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
        下次特價通知我
      </button>
      <button class="detail-cta-btn detail-cta-btn--secondary" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><path d="M15 3h6v6M10 14L21 3" />
        </svg>
        到官網看
      </button>
    </div>
  </div>
</body>
</html>
