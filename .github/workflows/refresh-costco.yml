name: Refresh Costco Snapshot

# "接 4" — move the ~18-30s live crawl off the request path. This scheduled job
# keeps backend/costco_data.py fresh; the API is always served its offline copy.
#
on:
  schedule:
    - cron: '0 4 * * *'   # daily ~04:00 UTC — scheduled runs default to sink=telegram
  workflow_dispatch:
    # A manual trigger can choose a delivery sink; a manual run left with no `sink`
    # stays on the SAFE default (sink=log: scan + log only, non-polluting).
    # Scheduled cron runs, by contrast, default to sink=telegram (a daily digest),
    # and no-op to log if the Telegram secrets aren't set (CI stays green).
    inputs:
      sink:
        description: delivery sink — log (no delivery) / github (digest comment) / telegram
        default: "log"
        type: choice
        options: [log, github, telegram]
      limit:
        description: max alerts delivered this run (0 = no cap)
        default: "10"
        type: number
      fail:
        # #12 stall-guard fail mode. OFF by default: warn-not-fail (a legitimately
        # empty day must not red the daily cron). Flip to "true" on a MANUAL run to
        # EXERCISE / enforce the hard-fail path; CI also honors a STALL_GUARD_FAIL
        # repo variable. Scheduled runs never see this input, so they stay warn.
        description: "hard-fail the run when no real costco point lands (default off — warn-not-fail)"
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The new snapshot must be committed, so this job gets contents:write. The
    # alert sink (sink=github) may find/create/comment a '🔔 價格警報' issue, so
    # it also needs issues:write — otherwise emit_github's GITHUB_TOKEN 403s and
    # the github path silently no-ops.
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Git identity for the automated commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Capture pre-refresh history baseline (#12)
        # The Stall-guard below compares the POST-refresh worktree history against
        # this run's PRE-refresh committed history. Capture the SHA now, before the
        # refresh step can advance HEAD, so the baseline is the true "before".
        id: baseline
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refresh snapshot (crawl + regenerate + push if changed)
        # This single job refreshes the Costco snapshot AND appends today's real
        # observation into the shared history_data.json SSOT. The refresh is
        # offline-safe — a failed live crawl leaves the existing artifacts intact.
        run: python3 scripts/refresh_snapshot.py

      - name: Stall-guard (#12 — prove a real costco point landed this refresh)
        # AC1/AC2/AC3 for "排程快照真的落地護欄": a scheduled crawl that fails
        # silently must NOT go unnoticed. So — after the refresh step — assert that a
        # NEW real costco point actually appended into history_data.json (detect_new_real
        # over the pre-refresh baseline vs the post-refresh worktree), print it LOUD so
        # the CI log self-proves "landed" vs "not", and on a landing (re)write the
        # git-tracked refresh_state.json "last successful refresh" SSOT + carry it.
        #
        # WARN-NOT-FAIL BY DEFAULT: a legitimately empty day (Costco had no new price,
        # or a same-day re-run) must NOT red the daily cron. "Not silent" is satisfied
        # by the loud + logged + recorded [stall-guard] warning, not by turning every
        # quiet day into a failed run. A NO-landing only hard-fails when this run opts
        # in: the `fail` workflow_dispatch input, or a STALL_GUARD_FAIL repo variable.
        env:
          # Scheduled runs have no `fail` input (=> "" => warn mode). A manual run can
          # flip it; CI also honors a STALL_GUARD_FAIL repo variable either way.
          STALL_GUARD_FAIL: "${{ inputs.fail }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # (a) pre-refresh baseline = the COMMITTED history this run started with
          BASE="${{ steps.baseline.outputs.sha }}"
          BASELINE="$(mktemp)"
          git show "$BASE:backend/history_data.json" > "$BASELINE"
          # (b) POST-refresh worktree history is backend/history_data.json.
          # (c)+(d) detect + print the LOUD [stall-guard] line so the log self-proves.
          # (e) on a landing the guard rewrites backend/refresh_state.json (the SSOT);
          #      on a no-landing it writes nothing, so "stalled since when" stays visible.
          #      No --e here so we get to read the guard's exit code before deciding.
          python3 backend/stall_guard.py \
            --prev "$BASELINE" \
            --cur backend/history_data.json \
            --state backend/refresh_state.json
          GUARD_RC=$?
          # (e-2) if a landing wrote a fresh SSOT, carry it in its own commit + push so
          #        it survives the ephemeral runner. A no-landing leaves it clean: no-op.
          if git status --porcelain -- backend/refresh_state.json | grep -q .; then
            git add backend/refresh_state.json
            git commit -m "chore(stall-guard)[#12]: record last refresh" >/dev/null 2>&1 || true
            git push >/dev/null 2>&1 || true
          fi
          # WARN-not-fail: a no-landing warns (exit 0). Only FAIL mode (guard exited
          # non-zero) propagates to the job, so a quiet day stays green.
          exit "$GUARD_RC"

      - name: Scan + deliver alerts (#2 — reuses the price_verdict SSOT)
        # Reads the persisted history, fires an alert per SKU that crosses an alarm
        # verdict AND isn't already in the dedup state. Routing: use the explicit
        # `sink` input if given; else a SCHEDULED run defaults to 'telegram' (a daily
        # digest to you), while a MANUAL run with no input stays on the safe 'log'
        # default. If the Telegram secrets are absent the sink no-ops to log (CI
        # stays green, no delivery). --limit caps what is *sent*; the dedup state
        # still advances on the full set.
        env:
          # github sink only needs the free GITHUB_TOKEN; the telegram sink reads
          # these from the repo Secrets. When a secret isn't set it resolves to an
          # EMPTY string, so the sink detects no creds and falls back to the log
          # sink (CI-safe: no auto-delivery, no failure). NEVER a literal in-file.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/notify_alerts.py --sink "${{ github.event.inputs.sink || (github.event_name == 'schedule' && 'telegram') || 'log' }}" --limit "${{ github.event.inputs.limit || '10' }}"
