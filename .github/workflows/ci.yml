name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

# Mirrors the mini-calculator pipeline you've been learning, but with TWO
# job streams (frontend + backend) joined by `needs:`. A later step only runs
# if its prerequisite is green — that's the "gate" that protects main/master.
jobs:
  # ---- Frontend: lint -> unit -> coverage gate -> e2e -> deploy ----
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm install --cache .npm --foreground-deps
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Coverage gate (RED on regression below threshold)
        working-directory: frontend
        run: npm run test:coverage
      - name: E2E (Playwright)
        working-directory: frontend
        run: |
          npm run build
          npx playwright install --with-deps
          npm run test:e2e
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  # Deploy frontend to GitHub Pages. Gated on frontend job being green: it will
  # NOT run (queued -> skipped) if lint/unit/coverage/e2e failed.
  deploy-frontend:
    needs: frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    continue-on-error: true   # Pages deploy 在 token 沒有 Pages 權限時會 404，不阻擋 CI gate
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend deps
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Deploy Pages
        uses: actions/deploy-pages@v4

  # ---- Backend: install -> test -> (deploy API in prod) ----
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Backend tests
        working-directory: backend
        run: pytest -q
