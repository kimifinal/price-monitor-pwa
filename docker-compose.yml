# Optional: run the full stack locally with Docker (for when you add a DB).
# Right now the backend is in-memory, so `docker compose up` just starts the API.
version: "3.9"
services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
