name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

# Mirrors the mini-calculator pipeline you've been learning, but with TWO
# job streams (frontend + backend) joined by `needs:`. A later step only runs
# if its prerequisite is green — that's the "gate" that protects main/master.
jobs:
  # ---- Frontend: lint -> unit -> coverage gate -> e2e -> deploy ----
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm install --cache .npm --foreground-deps
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Coverage gate (RED on regression below threshold)
        working-directory: frontend
        run: npm run test:coverage
      # ---- Blocking e2e: the existing guard-rails (compare + watchlist) ----
      - name: E2E guard-rails (Playwright)
        working-directory: frontend
        run: |
          npm run build
          npx playwright install --with-deps
          npx playwright test tests/e2e/compare.spec.ts tests/e2e/watchlist.spec.ts
      # ---- Non-blocking offline guard (#6 離線 PWA) ----
      # Exercises the whole chain: the service worker precaches the committed
      # snapshot, and with the network cut the 即時比價 (live) cards must render
      # from that snapshot. Best-effort + `continue-on-error: true` because it
      # needs a real browser; the DETERMINISTIC hard guard is
      # tests/unit/offline-cache.test.js (runs browser-less, in the blocking
      # unit step). This step can NEVER turn CI red on a restricted/offline runner.
      - name: E2E offline — SW + baked snapshot (best-effort, non-blocking)
        working-directory: frontend
        continue-on-error: true
        run: |
          npx playwright test tests/e2e/offline.spec.ts
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  # Deploy frontend to GitHub Pages. Gated on frontend job being green: it will
  # NOT run (queued -> skipped) if lint/unit/coverage/e2e failed.
  #
  # ISSUE #6 AC1 / AC2 / AC3 — now FULLY resolved (no PAT, no secret in repo):
  #   AC2 was "Pages not enabled in the account", NOT a permission gap. The
  #   built-in GITHUB_TOKEN carries `pages: write` (declared below) AS LONG AS the
  #   account side is set up, which needs only TWO repo settings:
  #     1) Settings -> Pages -> Build and deployment -> Source = "GitHub Actions"
  #     2) Settings -> Actions -> Environments -> New environment "github-pages"
  #        (Deployment branches = Any branch / master)
  #   No fine-grained PAT, no PAGES_PAT secret, no id-token swap required.
  #   (The earlier "needs a PAT" note was incorrect — GITHUB_TOKEN has pages:write
  #    when the workflow declares it, which this job does on `pages: write`.)
  #   AC1 (continue-on-error) and AC3 (live-URL check) are now BLOCKING: a deploy
  #   failure / an unreachable site turns CI red, by design.
  deploy-frontend:
    needs: frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend deps
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
      # AC3 (issue #6): a live-URL reachability HEAD check of the freshly
      # deployed Pages site — now BLOCKING (Pages is live; AC2 done). A non-200
      # means the deploy did not reach Pages and fails the pipeline.
      - name: Verify live Pages URL (AC3 reachability — blocking)
        working-directory: frontend
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          SITE="https://${OWNER}.github.io/${REPO}/index.html"
          echo "Probing deployed site: $SITE"
          # A non-200 / connection failure FAILS this step => CI red until the
          # deploy actually reaches Pages. GH Pages first activation can lag a
          # couple of minutes, so retry a few times; 200 on any attempt passes,
          # no 200 after the retries fails the pipeline (a real gate).
          for i in 1 2 3 4 5 6; do
            code=$(curl -fsSL --max-time 30 -o /dev/null -w "%{http_code}" "$SITE" || echo "000")
            echo "attempt $i: http=$code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "❌ live URL not reachable after retries (Pages not deployed?)"
          exit 1

  # ---- Backend: install -> test -> (deploy API in prod) ----
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Backend tests
        working-directory: backend
        run: pytest -q
