name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

# Mirrors the mini-calculator pipeline you've been learning, but with TWO
# job streams (frontend + backend) joined by `needs:`. A later step only runs
# if its prerequisite is green — that's the "gate" that protects main/master.
jobs:
  # ---- Frontend: lint -> unit -> coverage gate -> e2e -> deploy ----
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm install --cache .npm --foreground-deps
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Coverage gate (RED on regression below threshold)
        working-directory: frontend
        run: npm run test:coverage
      # ---- Blocking e2e: the existing guard-rails (compare + watchlist) ----
      - name: E2E guard-rails (Playwright)
        working-directory: frontend
        run: |
          npm run build
          npx playwright install --with-deps
          npx playwright test tests/e2e/compare.spec.ts tests/e2e/watchlist.spec.ts
      # ---- Non-blocking offline guard (#6 離線 PWA) ----
      # Exercises the whole chain: the service worker precaches the committed
      # snapshot, and with the network cut the 即時比價 (live) cards must render
      # from that snapshot. Best-effort + `continue-on-error: true` because it
      # needs a real browser; the DETERMINISTIC hard guard is
      # tests/unit/offline-cache.test.js (runs browser-less, in the blocking
      # unit step). This step can NEVER turn CI red on a restricted/offline runner.
      - name: E2E offline — SW + baked snapshot (best-effort, non-blocking)
        working-directory: frontend
        continue-on-error: true
        run: |
          npx playwright test tests/e2e/offline.spec.ts
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  # Deploy frontend to GitHub Pages. Gated on frontend job being green: it will
  # NOT run (queued -> skipped) if lint/unit/coverage/e2e failed.
  #
  # ISSUE #6 AC1 / AC2 / AC3 — the "部署收尾" safe subset:
  #   • AC1 (continue-on-error): LEAVE on. The deploy does NOT block CI yet. This
  #     is the LAST step to flip to a real gate once Pages is live (AC2 done).
  #   • AC2 (FUTURE TODO — needs the user's GitHub account, NOT the repo): a
  #     fine-grained PAT with the `pages: write` scope added to the Actions
  #     secret (e.g. PAGES_PAT) AND a `github-pages` environment created at the
  #     repo level, both bound to the repo's Actions. GitHub's own GITHUB_TOKEN
  #     does NOT carry Pages write, so deploy currently 404s. Do NOT commit any
  #     secret/token into the repo — configure that on the user's GitHub account.
  #     Exact steps: (1) create a fine-grained PAT, repo-scoped, add the Pages
  #     access with "Write" ; (2) Settings -> Actions -> Secrets -> add
  #     PAGES_PAT=ghp_... ; (3) Settings -> Actions -> Environments -> New
  #     environment "github-pages". Until then, keep continue-on-error: true.
  #   • AC3 (live URL): no live-URL requirement in this pass — the reachability
  #     check below is continue-on-error so it can't turn CI red while AC2 is
  #     pending. It will start passing automatically a moment after AC2 lands.
  deploy-frontend:
    needs: frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    continue-on-error: true   # AC1: non-blocking until AC2 (Pages PAT) is configured
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend deps
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
      # AC3 (issue #6): a live-URL reachability HEAD check of the freshly
      # deployed Pages site. `continue-on-error: true` so it is NON-BLOCKING —
      # Pages is not live until AC2 (the user's Page PAT) is configured, and
      # this job as a whole is continue-on-error. It starts passing on its own
      # the moment AC2 lands; it can never turn the pipeline red in the meantime.
      - name: Verify live Pages URL (AC3 reachability — non-blocking)
        working-directory: frontend
        continue-on-error: true
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          SITE="https://${OWNER}.github.io/${REPO}/index.html"
          echo "Probing deployed site: $SITE"
          # 200 = reachable; anything else -> 'not live yet' (expected).
          curl -fsSL --max-time 30 -o /dev/null -w "http=%{http_code}\n" "$SITE" \
            || echo "⚠ live URL not reachable yet (expected until AC2); CI stays green (continue-on-error)."

  # ---- Backend: install -> test -> (deploy API in prod) ----
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Backend tests
        working-directory: backend
        run: pytest -q
